name: learnsignph
description: LearnSignPH - Interactive Filipino Sign Language Learning App
publish_to: 'none'
version: 0.1.0

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6

  # Firebase
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  cloud_firestore: ^5.4.4
  firebase_storage: ^12.3.4
  image_picker: ^1.1.2
  http: ^1.2.2

  # Video playback for sign demonstrations
  video_player: ^2.9.2
  chewie: ^1.8.5
  camera: ^0.12.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.4

flutter_launcher_icons:
  android: true
  ios: false
  image_path: assets/images/filipino_sign_language_learning_icon.png
  adaptive_icon_background: "#0B4FB3"
  adaptive_icon_foreground: assets/images/filipino_sign_language_learning_icon.png
  adaptive_icon_foreground_inset: 16
  min_sdk_android: 21

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/images/content/
    - assets/ml_models/
